name: Bug Report
description: File a bug report
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report
        Please fill out the sections below to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior or error...
    validations:
      required: true
  - type: textarea
    id: sql-reproducer
    attributes:
      label: Reproducible SQL Example
      description: Provide minimal SQL query and Python code to reproduce the issue.
      render: python
      placeholder: |
        import sqlleaf

        sql = """
        -- your minimal SQL here
        """
        lineage = sqlleaf.Lineage()
        lineage.generate(sql=sql, dialect="postgres")
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen (e.g. expected lineage graph nodes/edges).
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior / Traceback
      description: What happened instead? (Include full traceback/error log or incorrect lineage output).
      render: shell
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, or screenshots about the problem here.
    validations:
      required: false
